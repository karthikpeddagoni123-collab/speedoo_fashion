{% extends "base.html" %}
{% block title %}{{ product.name }} — Speedoo Fashion{% endblock %}

{% block content %}
<a href="{{ url_for('customer.shop') }}" style="font-size:13px">← back to shop</a>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:12px">
    <div>
        <img class="thumb-lg" style="width:100%;height:auto;max-height:520px"
             src="{{ url_for('static', filename='uploads/' + product.image_file) }}"
             alt="{{ product.name }}">
    </div>
    <div>
        <h2 style="margin-top:0">{{ product.name }}</h2>
        <div style="color:#888">{{ product.category }}</div>
        <div style="font-size:28px;color:#c2185b;font-weight:800;margin:8px 0">
            ₹{{ '%0.0f' % product.price }}
        </div>
        {% if product.description %}
            <p style="color:#444">{{ product.description }}</p>
        {% endif %}

        <form method="post">
            <input type="hidden" name="action" value="add_to_bag">
            <div class="form-row">
                <label>Size</label>
                <select name="size" required>
                    <option value="">-- choose a size --</option>
                    {% for s in sizes %}
                        <option value="{{ s.size }}"
                                {{ 'disabled' if s.stock==0 else '' }}>
                            {{ s.size }} {{ '(out of stock)' if s.stock==0 else '(' + s.stock|string + ' left)' }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-row">
                <label>Quantity</label>
                <input type="number" name="qty" value="1" min="1" max="10">
            </div>
            <button class="btn" type="submit">Add to Bag</button>
        </form>

        <form method="post" style="margin-top:10px">
            <input type="hidden" name="action" value="wishlist_toggle">
            <button class="btn secondary" type="submit">
                {{ 'Remove from Wishlist' if in_wish else 'Add to Wishlist' }}
            </button>
        </form>
    </div>
</div>
{% endblock %}
