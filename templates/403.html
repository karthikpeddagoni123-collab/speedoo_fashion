<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>403 — Speedoo Fashion</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div style="max-width:560px;margin:80px auto;background:#fff;border:1px solid #eee;border-radius:8px;padding:32px;text-align:center">
    <h1 style="font-size:48px;color:#c2185b;margin:0">403</h1>
    <h3 style="margin:0 0 12px;text-transform:uppercase;letter-spacing:1px">Forbidden</h3>
    <p>{{ message or 'You do not have permission to access this resource.' }}</p>
    <p style="color:#888;font-size:13px">Speedoo Fashion is a single-owner men's fashion store. Only the authorized owner can manage the product collection.</p>
    <a class="btn" href="{{ url_for('customer.landing') }}">Back to Store</a>
    <a class="btn secondary" style="margin-left:8px" href="{{ url_for('customer.auth') }}">Login</a>
</div>
</body>
</html>
